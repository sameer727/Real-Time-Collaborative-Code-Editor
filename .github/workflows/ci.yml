name: CI

on:
  push:
  pull_request:

jobs:
  server-tests:
    name: Server tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand({ ping: 1 })\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/rtc-editor-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install server deps
        run: npm ci
        working-directory: server
      - name: Wait for MongoDB
        run: |
          for i in {1..30}; do
            if mongo --eval "db.adminCommand({ ping: 1 })" >/dev/null 2>&1; then
              echo "Mongo ready"; break
            fi
            sleep 1
          done
      - name: Run server tests
        run: npm test --silent
        working-directory: server

  client-build:
    name: Client build
    runs-on: ubuntu-latest
    needs: server-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install client deps
        run: npm ci
        working-directory: client
      - name: Build client
        run: npm run build --silent
        working-directory: client

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: client-build
    services: {}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install server deps
        run: npm ci
        working-directory: server
      - name: Start server in background
        run: node src/index.js &
        working-directory: server
      - name: Wait for server
        working-directory: server
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5000/api/health >/dev/null 2>&1; then
              echo "Server ready"; exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready" >&2; exit 1
      - name: Install client deps
        run: npm ci
        working-directory: client
      - name: Start client preview
        run: npm run preview --silent &
        working-directory: client
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: client
      - name: Run E2E tests
        run: npx playwright test --output=playwright-results --reporter=list
        working-directory: client
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: client/playwright-results
