<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RTC Editor - Test</title>
    <style>html,body,#container{height:100%;margin:0;padding:0;}</style>
  </head>
  <body>
    <div id="container"></div>

    <!-- Monaco loader -->
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.36.1/min/vs/loader.js"></script>
    <script src="https://unpkg.com/yjs@13.5.45/dist/yjs.js"></script>
    <script src="https://unpkg.com/y-websocket@1.4.5/dist/y-websocket.js"></script>
    <script src="https://unpkg.com/y-monaco@1.0.0/dist/y-monaco.js"></script>

    <script>
      (async function () {
        const params = new URLSearchParams(window.location.search);
        const room = params.get('room') || 'default-room';

        // Configure Monaco loader
        require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.36.1/min/vs' } });
        require(['vs/editor/editor.main'], function () {
          const editor = monaco.editor.create(document.getElementById('container'), {
            value: '// Loading...\n',
            language: 'javascript',
            automaticLayout: true
          });

          // Yjs setup
          const ydoc = new Y.Doc();
          const provider = new WebsocketProvider('ws://'+location.hostname+':5000', room, ydoc);
          const yText = ydoc.getText('monaco');

          // Bind
          new YMonaco.MonacoBinding(yText, editor.getModel(), new Set([editor]), provider.awareness);

          // Expose for tests
          window.__rtcEditors = window.__rtcEditors || {};
          window.__rtcEditors[room] = editor;
        });
      })();
    </script>
  </body>
</html>
