<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RTC Editor - Test</title>
    <style>html,body,#container{height:100%;margin:0;padding:0;}</style>
  </head>
  <body>
    <div id="container"></div>

    <!-- Monaco loader -->
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.36.1/min/vs/loader.js"></script>

    <!-- Load runtime dependencies (use jsdelivr to avoid ORB blocks on unpkg in CI) -->
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const room = params.get('room') || 'default-room';

        // Diagnostics visible to tests
        window.__rtcDiag = window.__rtcDiag || {};
        window.__rtcDiag[room] = { hasMonaco: false, hasY: false, hasYMonaco: false, hasYWebsocket: false, failedLoads: [], usedVendor: null };
        // Periodic log to help CI debugging
        setInterval(() => console.log('DIAG:', window.__rtcDiag[room]), 5000);

        function loadScript(src, onLoadKey, onErrorMsg) {
          const s = document.createElement('script');
          s.src = src;
          s.crossOrigin = 'anonymous';
          s.onload = () => { window.__rtcDiag[room][onLoadKey] = true; console.log('LOADED', src); };
          s.onerror = () => { window.__rtcDiag[room].failedLoads.push(src); console.error('FAILED LOAD', src, onErrorMsg || ''); };
          document.head.appendChild(s);
          return s;
        }

        // Try vendor bundle on the local server first to avoid CDN flakiness in CI.
        function loadVendorThenFallback() {
          const vendorUrl = '/vendor/vendor-bundle.js';
          const s = document.createElement('script');
          s.src = vendorUrl;
          s.crossOrigin = 'anonymous';
          s.onload = () => {
            window.__rtcDiag[room].usedVendor = 'local';
            window.__rtcDiag[room].hasY = !!window.Y;
            window.__rtcDiag[room].hasYWebsocket = !!window.WebsocketProvider;
            window.__rtcDiag[room].hasYMonaco = !!window.YMonaco;
            console.log('LOADED local vendor bundle', vendorUrl);
          };
          s.onerror = () => {
            window.__rtcDiag[room].usedVendor = 'cdn';
            console.warn('Local vendor bundle failed, falling back to CDN', vendorUrl);
            // Prefer cdn.jsdelivr (previous CI traces showed unpkg requests were blocked by ORB)
            loadScript('https://cdn.jsdelivr.net/npm/yjs@13.5.45/dist/yjs.js', 'hasY', 'yjs');
            loadScript('https://cdn.jsdelivr.net/npm/y-websocket@1.4.5/dist/y-websocket.js', 'hasYWebsocket', 'y-websocket');
            // y-monaco @1.0.0 is not available on some CDNs; use an older published version as a more reliable fallback
            loadScript('https://cdn.jsdelivr.net/npm/y-monaco@0.1.6/dist/y-monaco.js', 'hasYMonaco', 'y-monaco');
          };
          document.head.appendChild(s);

          // Safety: if vendor bundle doesn't initialize quickly, also try CDN fallbacks
          setTimeout(() => {
            if (!window.Y && !window.WebsocketProvider && !window.YMonaco) {
              window.__rtcDiag[room].usedVendor = 'cdn';
              console.warn('Vendor bundle not available yet, loading CDN fallbacks');
              loadScript('https://cdn.jsdelivr.net/npm/yjs@13.5.45/dist/yjs.js', 'hasY', 'yjs');
              loadScript('https://cdn.jsdelivr.net/npm/y-websocket@1.4.5/dist/y-websocket.js', 'hasYWebsocket', 'y-websocket');
              loadScript('https://cdn.jsdelivr.net/npm/y-monaco@0.1.6/dist/y-monaco.js', 'hasYMonaco', 'y-monaco');
            }
          }, 500);
        }
        loadVendorThenFallback();

        // Configure Monaco loader and initialize editor once monaco is available
        require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.36.1/min/vs' } });
        require(['vs/editor/editor.main'], function () {
          window.__rtcDiag[room].hasMonaco = !!window.monaco;

          const editor = monaco.editor.create(document.getElementById('container'), {
            value: '// Loading...\n',
            language: 'javascript',
            automaticLayout: true
          });

          // Yjs setup - guard against missing runtime scripts
          if (!window.Y || !window.WebsocketProvider || !window.YMonaco) {
            console.error('Missing runtime library: Y, WebsocketProvider or YMonaco not available', {
              hasY: !!window.Y,
              hasWebsocket: !!window.WebsocketProvider,
              hasYMonaco: !!window.YMonaco
            });
            window.__rtcDiag[room].hasY = !!window.Y;
            window.__rtcDiag[room].hasYMonaco = !!window.YMonaco;
            return; // don't attempt to bind
          }

          const ydoc = new Y.Doc();
          window.__rtcDiag[room].hasY = true;
          const provider = new WebsocketProvider('ws://'+location.hostname+':5000', room, ydoc);
          const yText = ydoc.getText('monaco');

          // Bind
          try {
            new YMonaco.MonacoBinding(yText, editor.getModel(), new Set([editor]), provider.awareness);
            window.__rtcDiag[room].hasYMonaco = !!window.YMonaco;
          } catch (e) {
            console.error('Failed to bind Monaco with Yjs', e);
          }

          // Expose for tests and debugging
          window.__rtcEditors = window.__rtcEditors || {};
          window.__rtcYDocs = window.__rtcYDocs || {};
          window.__rtcProviders = window.__rtcProviders || {};
          window.__rtcEditors[room] = editor;
          window.__rtcYDocs[room] = ydoc;
          window.__rtcProviders[room] = provider;
        });
      })();
    </script>
  </body>
</html>
